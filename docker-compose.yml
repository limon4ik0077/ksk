services:
  ksk-shop:
    build: .
    container_name: ksk-shop
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
